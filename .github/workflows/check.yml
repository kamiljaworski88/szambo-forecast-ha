name: Validate configuration and forecast
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install PyYAML homeassistant==2025.10.4 'pycares<5'
      - run: python scripts/check.py
      - run: python scripts/smoke_ha.py
      - run: python scripts/smoke_ha.py --ui
